version: "3.9"

services:
  promisces-postgres:
    image: postgres:15
    container_name: postgres
    volumes:
      - ./postgres-data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=promisces
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=postgres
    restart: on-failure
    ports:
      - "5432:5432/tcp"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  promiscesapi:
    container_name: promiscesapi
    build: .
    ports:
      - "7070:8080"
    depends_on:
      promisces-postgres:
        condition: service_healthy

  promiscessimilarity:
    container_name: promiscessimilarity
    build: src/main/resources/similarityService/.
    ports:
      - "5000:5000"
    depends_on:
      promisces-postgres:
        condition: service_healthy